<!DOCTYPE html>
<html lang="en">
  <head>
    <script>document.documentElement.classList.add('js');</script>
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.name }}</title>
    {% seo title=false %}
    {% include meta.html %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/assets/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />
    <link rel="canonical" href="{{ site.url }}{{ page.url }}" />

    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/favicon.svg">
    {% include analytics_head.html %}
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}

    <main id="main" role="main">
      {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ site.baseurl }}/assets/nav.js" defer></script>
    {% include analytics.html %}
  </body>
</html>
