<header class="site-header">
  <div class="container site-header-inner">
    <a class="site-brand" href="{{ site.baseurl }}/" aria-label="{{ site.name }} home">
      <span class="site-brand-prompt" aria-hidden="true">~/</span><span class="site-name">{{ site.name }}</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" hidden>
      <span class="visually-hidden">Menu</span>
      <svg class="nav-toggle-icon" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <path class="nav-toggle-open" d="M3 6h14M3 10h14M3 14h14" />
        <path class="nav-toggle-close" d="M5 5l10 10M15 5L5 15" />
      </svg>
    </button>
    {% include navigation.html %}
  </div>
</header>
